<!doctype html><html><head><title>VWHUD compass</title></head><body>
<div class="compass-tick accent" data-vw-for-each="compass.ticks" data-vw-x="x" data-vw-y="y">
  <svg class="tick-major" data-vw-visible="major" viewBox="0 0 1 10"><path d="M 0 0 L 0 10" stroke="currentcolor"></path></svg>
  <svg class="tick-medium" data-vw-visible="medium" viewBox="0 0 1 7"><path d="M 0 0 L 0 7" stroke="currentcolor"></path></svg>
  <svg class="tick-minor" data-vw-visible="minor" viewBox="0 0 1 4"><path d="M 0 0 L 0 4" stroke="currentcolor"></path></svg>
  <span class="heading-label" data-vw-visible="major" data-vw-text="label"></span>
</div>
<div class="compass-marker" data-vw-for-each="compass.markers" data-vw-x="x" data-vw-y="y" data-vw-opacity="opacity" data-vw-scale="scale"><vw-symbol class="compass-marker" name="compass-marker" value="marker"></vw-symbol></div>
<svg class="compass-center" viewBox="0 0 8 6"><path d="M 0 0 L 8 0 L 4 6 Z" fill="currentcolor"></path></svg>
</body></html>
