<!doctype html><html><head><title>VWHUD</title></head><body>
<div class="minimalist-node-91 vwhud-panel-player" data-vw-anchor="bottom-left" data-vw-visible="condition.always"><svg class="minimalist-node-92 fill-panel-background-1" viewBox="0 0 100 100" stroke-width="0" fill-opacity="0.44" stroke-opacity="0"><rect x="0" y="0" width="100" height="100"></rect></svg>
<svg class="minimalist-node-93 paint-fill-70cfe0 paint-stroke-d9e3e8" viewBox="0 0 360 236" stroke-width="0" fill-opacity="0.10" stroke-opacity="0"><rect x="0" y="0" width="360" height="236"></rect></svg>
<span class="minimalist-node-94 paint-color-e8f0f4">PLAYER DATA</span>
<span class="minimalist-node-95 paint-color-c6d0d6">UNIVERSAL</span>
<span class="minimalist-node-96 paint-color-ffffff" data-vw-template="{player.universaltime:time24}"></span>
<svg class="minimalist-node-97 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 38 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 38 0"></path></svg>
<svg class="minimalist-node-98 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 1 10" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 0 10"></path></svg>
<svg class="minimalist-node-99 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 38 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 38 0"></path></svg>
<svg class="minimalist-node-100 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 1 10" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 0 10"></path></svg>
<svg class="minimalist-node-101 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 38 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 38 0"></path></svg>
<svg class="minimalist-node-102 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 1 10" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 0 10"></path></svg>
<svg class="minimalist-node-103 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 38 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 38 0"></path></svg>
<svg class="minimalist-node-104 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 1 10" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 0 10"></path></svg>
<span class="minimalist-node-105 paint-color-c6d0d6">SERIAL</span>
<span class="minimalist-node-106 paint-color-ffffff" data-vw-template="{player.serial:raw}"></span>
<span class="minimalist-node-107 paint-color-9eadb5" data-vw-template="CR {credits:integer}"></span>
<span class="minimalist-node-108 paint-color-ffffff" data-vw-visible="condition.digipicksavailable" data-vw-template="DIGI {player.digipicks:integer}"></span>
<svg class="minimalist-node-109 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="minimalist-node-110 paint-color-e8f0f4">XP TO LEVEL</span>
<span class="minimalist-node-111 paint-color-9eadb5" data-vw-template="LVL {player.level:integer}"></span>
<span class="minimalist-node-112 paint-color-ffffff" data-vw-template="{player.xppercentage:percent}"></span>
<vw-meter class="minimalist-node-113 paint-color-e8f0f4 paint-background-color-0d1114b8" value="player.xppercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="minimalist-node-114 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="minimalist-node-115 paint-color-d34a5b">PLAYER HEALTH</span>
<span class="minimalist-node-116 paint-color-ffffff" data-vw-template="{player.healthpercentage:percent}"></span>
<vw-meter class="minimalist-node-117 paint-color-d34a5b paint-background-color-0d1114b8" value="player.healthpercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="minimalist-node-118 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="minimalist-node-119 paint-color-70cfe0">O2 / CO2</span>
<span class="minimalist-node-120 paint-color-ffffff" data-vw-template="O2 {player.oxygenpercentage:percent}"></span>
<span class="minimalist-node-121 paint-color-ffffff" data-vw-template="CO2 {player.carbondioxidepercentage:percent}"></span>
<vw-meter class="minimalist-node-122 paint-color-70cfe0 paint-background-color-0d1114b8" value="player.oxygenpercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<vw-meter class="minimalist-node-123 paint-color-e0a85b paint-background-color-0d111400" value="player.carbondioxidepercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="minimalist-node-124 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="minimalist-node-125 paint-color-a69ad8">BOOST CHARGE</span>
<span class="minimalist-node-126 paint-color-ffffff" data-vw-template="{boost.percentage:percent}"></span>
<vw-meter class="minimalist-node-127 paint-color-a69ad8 paint-background-color-0d1114b8" value="boost.percentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="minimalist-node-128 paint-fill-none paint-stroke-d9e3e8" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="minimalist-node-129 paint-color-64e572">ENCUMBRANCE</span>
<span class="minimalist-node-130 paint-color-ffffff" data-vw-template="MASS {carry.current:integer}/{carry.maximum:integer} KG"></span>
<span class="minimalist-node-131 paint-color-ffffff" data-vw-template="{carry.percentage:percent}"></span>
<vw-meter class="minimalist-node-132 paint-color-64e572 paint-background-color-0d1114b2" value="carry.percentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
</div>
</body></html>
