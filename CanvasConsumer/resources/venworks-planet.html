<!doctype html><html><head><title>VWHUD</title></head><body>
<div class="vw-arc-planet vwhud-panel-environment" data-vw-anchor="bottom-right" data-vw-visible="condition.always">
<svg class="vw-arc-planet-frame paint-fill-none stroke-visor-cyan" viewBox="0 0 360 270" stroke-width="1.25" fill-opacity="0" stroke-opacity="0.8"><path d="M 348 16 L 348 252 L 160 252 M 348 16 L 308 16 M 348 210 C 348 252 312 252 270 252"></path></svg>
<svg class="vw-arc-planet-arc paint-fill-none stroke-visor-cyan" viewBox="0 0 48 160" stroke-width="3" fill-opacity="0" stroke-opacity="0.85"><path d="M 40 8 C 8 40 8 120 40 152"></path></svg>
<svg class="vw-arc-planet-arc-inner paint-fill-none stroke-visor-amber" viewBox="0 0 40 140" stroke-width="2" fill-opacity="0" stroke-opacity="0.55"><path d="M 32 8 C 6 36 6 104 32 132"></path></svg>
<span class="vw-arc-e-title color-accent-primary-1">PLANET DATA</span>
<span class="vw-arc-e-local color-foreground-muted-1">LOCAL</span>
<span class="vw-arc-e-time color-foreground-primary-1" data-vw-template="{environment.localtime:time24}"></span>
<span class="vw-arc-e-sun color-foreground-primary-1" data-vw-template="{environment.solartransitioncountdown:raw}"></span>
<span class="vw-arc-e-name color-foreground-primary-1" data-vw-template="{location.name:raw}"></span>
<span class="vw-arc-e-o2-label color-foreground-muted-1">O2</span>
<span class="vw-arc-e-o2 color-foreground-primary-1" data-vw-template="{environment.oxygenpercentage:percent}"></span>
<span class="vw-arc-e-temp-label color-foreground-muted-1">TEMP</span>
<span class="vw-arc-e-temp color-foreground-primary-1" data-vw-template="{environment.temperature:temperature}"></span>
<span class="vw-arc-e-grav-label color-foreground-muted-1">GRAV</span>
<span class="vw-arc-e-grav color-foreground-primary-1" data-vw-template="{environment.gravity:gravity}"></span>
<span class="vw-arc-e-hazard-title color-accent-primary-1">HAZARDS</span>
<span class="vw-arc-e-suit-label color-accent-primary-1">SUIT</span>
<span class="vw-arc-e-suit-status color-state-caution-1" data-vw-template="{environment.protectionstatus:raw}"></span>
<span class="vw-arc-e-suit-value color-foreground-primary-1" data-vw-template="{environment.protectionpercentage:percent}"></span>
<vw-meter class="vw-arc-e-suit color-accent-primary-1 background-color-visor-track" value="environment.protectionlevel" min="0" max="1" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<span class="vw-arc-e-air-label color-accent-primary-1">AIR</span>
<span class="vw-arc-e-air-status color-foreground-primary-1" data-vw-template="{environment.hazard.airwatershortstatus:raw}"></span>
<vw-meter class="vw-arc-e-air color-accent-primary-1 background-color-visor-track" value="environment.hazard.airwaterexposurelevel" min="0" max="1" segments="8" gap="1" direction="up" partial="true"></vw-meter>
<span class="vw-arc-e-heat-label color-state-caution-1">HEAT</span>
<span class="vw-arc-e-heat-status color-foreground-primary-1" data-vw-template="{environment.hazard.thermalshortstatus:raw}"></span>
<vw-meter class="vw-arc-e-heat color-state-caution-1 background-color-visor-track" value="environment.hazard.thermalexposurelevel" min="0" max="1" segments="8" gap="1" direction="up" partial="true"></vw-meter>
<span class="vw-arc-e-corr-label color-state-caution-1">CORR</span>
<span class="vw-arc-e-corr-status color-foreground-primary-1" data-vw-template="{environment.hazard.corrosiveshortstatus:raw}"></span>
<vw-meter class="vw-arc-e-corr color-state-caution-1 background-color-visor-track" value="environment.hazard.corrosiveexposurelevel" min="0" max="1" segments="8" gap="1" direction="up" partial="true"></vw-meter>
<span class="vw-arc-e-rad-label color-state-critical-1">RAD</span>
<span class="vw-arc-e-rad-status color-foreground-primary-1" data-vw-template="{environment.hazard.radiationshortstatus:raw}"></span>
<vw-meter class="vw-arc-e-rad color-state-critical-1 background-color-visor-track" value="environment.hazard.radiationexposurelevel" min="0" max="1" segments="8" gap="1" direction="up" partial="true"></vw-meter>
</div>
</body></html>
