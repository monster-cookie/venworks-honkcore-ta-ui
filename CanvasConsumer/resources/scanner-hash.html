<!doctype html><html><head><title>VWHUD scanner</title></head><body>
<div class="scanner-heading-panel"></div>
<span class="scanner-heading accent" data-vw-text="scanner.heading"></span>
<div class="scanner-cell accent" data-vw-for-each="scanner.grid" data-vw-x="x" data-vw-y="y">
  <svg class="scanner-glyph" data-vw-visible="square" viewBox="-5 -5 10 10"><rect x="-4" y="-4" width="8" height="8" fill="none" stroke="currentColor" stroke-width="2"></rect></svg>
  <svg class="scanner-glyph" data-vw-visible="dot" viewBox="-5 -5 10 10"><circle cx="0" cy="0" r="3.5" fill="currentColor"></circle></svg>
</div>
</body></html>
