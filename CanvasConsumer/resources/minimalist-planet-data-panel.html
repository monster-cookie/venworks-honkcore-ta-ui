<!doctype html><html><head><title>VWHUD</title></head><body>
<div class="minimalist-node-31 vwhud-panel-environment" data-vw-anchor="bottom-right" data-vw-visible="condition.always"><img class="minimalist-node-32 paint-fill-0d1114 paint-stroke-d9e3e8 panel-smoke" src="panel-smoke.dds" alt="panel"></img>

<span class="minimalist-node-48 paint-color-c6d0d6">O2</span>

<span class="minimalist-node-52 paint-color-c6d0d6">GRAV</span>

<vw-meter class="minimalist-node-67 paint-color-e8f0f4 paint-background-color-0d1114c7" value="environment.protectionlevel" min="0" max="1" segments="16" gap="2" direction="right" partial="true"></vw-meter>

<span class="minimalist-node-79 paint-color-e8f0f4">AIR / WATER</span>
<span class="minimalist-node-80 paint-color-ffffff" data-vw-template="{environment.hazard.airwatershortstatus:raw}"></span>
<vw-meter class="minimalist-node-81 paint-color-e8f0f4 paint-background-color-0d1114b8" value="environment.hazard.airwaterexposurelevel" min="0" max="1" segments="8" gap="2" direction="up" partial="true"></vw-meter>
<span class="minimalist-node-82 paint-color-ffd800">THERMAL</span>
<span class="minimalist-node-83 paint-color-ffffff" data-vw-template="{environment.hazard.thermalshortstatus:raw}"></span>
<vw-meter class="minimalist-node-84 paint-color-ffd800 paint-background-color-0d1114b8" value="environment.hazard.thermalexposurelevel" min="0" max="1" segments="8" gap="2" direction="up" partial="true"></vw-meter>
<span class="minimalist-node-85 paint-color-ffd800">CORROSIVE</span>
<span class="minimalist-node-86 paint-color-ffffff" data-vw-template="{environment.hazard.corrosiveshortstatus:raw}"></span>
