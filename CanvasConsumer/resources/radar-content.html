<!doctype html><html><head><title>VWHUD radar</title></head><body>
<div class="radar-contact" data-vw-for-each="radar.contacts" data-vw-x="x" data-vw-y="y" data-vw-opacity="opacity">
  <svg class="radar-dot negative" data-vw-visible="enemy" viewBox="-4 -4 8 8"><circle cx="0" cy="0" r="3" fill="currentColor"></circle></svg>
  <svg class="radar-dot positive" data-vw-visible="ally" viewBox="-4 -4 8 8"><circle cx="0" cy="0" r="3" fill="currentColor"></circle></svg>
  <svg class="radar-dot accent" data-vw-visible="structure" viewBox="-4 -4 8 8"><rect x="-3.5" y="-3.5" width="7" height="7" fill="currentColor"></rect></svg>
</div>
<svg class="radar-player" viewBox="0 0 8 8"><rect x="0" y="0" width="8" height="8" fill="currentColor"></rect></svg>
</body></html>
