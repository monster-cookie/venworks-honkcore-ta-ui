<!doctype html><html><head><title>VWHUD</title></head><body>
<div class="themed-node-52 vwhud-panel-player" data-vw-anchor="bottom-left" data-vw-visible="condition.always"><span class="themed-node-53 color-accent-primary-1">PLAYER DATA</span>
<span class="themed-node-54 color-foreground-muted-1">UNIVERSAL</span>
<span class="themed-node-55 color-foreground-primary-1" data-vw-template="{player.universaltime:time24}"></span>
<svg class="themed-node-56 fill-panel-background-1 stroke-panel-border-1" viewBox="0 0 344 39" stroke-width="1" fill-opacity="0.58" stroke-opacity="0.35"><rect x="0" y="0" width="344" height="39"></rect></svg>
<span class="themed-node-57 color-foreground-muted-1">SERIAL</span>
<span class="themed-node-58 color-foreground-primary-1" data-vw-template="{player.serial:raw}"></span>
<span class="themed-node-59 color-accent-secondary-1" data-vw-template="CR {credits:integer}"></span>
<span class="themed-node-60 color-foreground-primary-1" data-vw-visible="condition.digipicksavailable" data-vw-template="DIGI {player.digipicks:integer}"></span>
<svg class="themed-node-61 paint-fill-none stroke-panel-border-1" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="themed-node-62 color-accent-primary-1">XP TO LEVEL</span>
<span class="themed-node-63 color-accent-secondary-1" data-vw-template="LVL {player.level:integer}"></span>
<span class="themed-node-64 color-foreground-primary-1" data-vw-template="{player.xppercentage:percent}"></span>
<vw-meter class="themed-node-65 color-accent-primary-1 background-color-panel-background-0-72" value="player.xppercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="themed-node-66 paint-fill-none stroke-panel-border-1" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="themed-node-67 color-meter-health-1">PLAYER HEALTH</span>
<span class="themed-node-68 color-foreground-primary-1" data-vw-template="{player.healthpercentage:percent}"></span>
<vw-meter class="themed-node-69 color-meter-health-1 background-color-panel-background-0-72" value="player.healthpercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="themed-node-70 paint-fill-none stroke-panel-border-1" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="themed-node-71 color-meter-oxygen-1">O2 / CO2</span>
<span class="themed-node-72 color-foreground-primary-1" data-vw-template="O2 {player.oxygenpercentage:percent}"></span>
<span class="themed-node-73 color-foreground-primary-1" data-vw-template="CO2 {player.carbondioxidepercentage:percent}"></span>
<vw-meter class="themed-node-74 color-meter-oxygen-1 background-color-panel-background-0-72" value="player.oxygenpercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<vw-meter class="themed-node-75 color-meter-carbondioxide-1 background-color-panel-background-0" value="player.carbondioxidepercentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="themed-node-76 paint-fill-none stroke-panel-border-1" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="themed-node-77 color-meter-boost-1">BOOST CHARGE</span>
<span class="themed-node-78 color-foreground-primary-1" data-vw-template="{boost.percentage:percent}"></span>
<vw-meter class="themed-node-79 color-meter-boost-1 background-color-panel-background-0-72" value="boost.percentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
<svg class="themed-node-80 paint-fill-none stroke-panel-border-1" viewBox="0 0 344 1" stroke-width="1" fill-opacity="0" stroke-opacity="0.45"><path d="M 0 0 L 344 0"></path></svg>
<span class="themed-node-81 color-state-clear-1">ENCUMBRANCE</span>
<span class="themed-node-82 color-foreground-primary-1" data-vw-template="MASS {carry.current:integer}/{carry.maximum:integer} KG"></span>
<span class="themed-node-83 color-foreground-primary-1" data-vw-template="{carry.percentage:percent}"></span>
<vw-meter class="themed-node-84 color-state-clear-1 background-color-panel-background-0-7" value="carry.percentage" min="0" max="100" segments="16" gap="2" direction="right" partial="true"></vw-meter>
</div>
</body></html>
