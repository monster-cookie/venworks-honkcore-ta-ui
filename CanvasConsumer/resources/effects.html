<!DOCTYPE html><html><head><title>VWHUD effects</title></head><body>
<span class="effects-count accent" data-vw-template="STATUS  +{buffcount:integer} / -{debuffcount:integer}"></span>
<span class="effects-page" data-vw-visible="showpages" data-vw-template="{page:integer}/{pagecount:integer}"></span>
<span class="effects-message" data-vw-visible="waiting">WAITING FOR STATUS</span>
<span class="effects-message" data-vw-visible="empty">NO ACTIVE EFFECTS</span>
<div class="effects-list">
  <div class="effect-row" data-vw-for-each="effectrows" data-vw-x="x" data-vw-y="y">
    <span class="effect-label positive" data-vw-visible="positive" data-vw-template="+ {label:raw}"></span>
    <span class="effect-label negative" data-vw-visible="negative" data-vw-template="- {label:raw}"></span>
  </div>
</div>
</body></html>
