<!doctype html><html><head><title>VWHUD</title></head><body>
<vw-hud-target target="canvas.watch" disabled="true"></vw-hud-target>
<vw-hud-target target="player.meters" disabled="true"></vw-hud-target>
<vw-include src="themed-faction-icon.html"></vw-include>
<vw-include src="themed-radar.html"></vw-include>
<vw-include src="themed-quest-tracker.html"></vw-include>
<vw-include src="themed-planet-data-panel.html"></vw-include>
<vw-include src="themed-player-data-panel.html"></vw-include>
<vw-include src="themed-equipment-rail.html"></vw-include>
<vw-include src="themed-compass.html"></vw-include>
<vw-include src="themed-threat-meter.html"></vw-include>
<vw-include src="themed-status-effect-screen.html"></vw-include>
<vw-include src="themed-scanner-hash-panel.html"></vw-include>
<vw-include src="themed-scanner-data-panel.html"></vw-include>
<div class="themed-node-211 vwhud-alert-critical-health" data-vw-anchor="top-center" data-vw-visible="condition.criticalhealth"><svg class="themed-node-212 fill-panel-background-1" viewBox="0 0 320 70" stroke-width="0" fill-opacity="0.28" stroke-opacity="0"><rect x="0" y="0" width="320" height="70"></rect></svg>
<svg class="themed-node-212 fill-accent-primary-1" viewBox="0 0 320 70" stroke-width="0" fill-opacity="0.10" stroke-opacity="0"><rect x="0" y="0" width="320" height="70"></rect></svg>
<span class="themed-node-213 color-state-critical-1">CRITICAL HEALTH</span>
<span class="themed-node-214 color-foreground-primary-1" data-vw-template="HEALTH {player.health:integer}/{player.maxhealth:integer}"></span>
</div>
<div class="themed-node-215 vwhud-prompt-vehicle-exit" data-vw-anchor="bottom-center" data-vw-visible="condition.invehicle"><span class="themed-node-216 color-foreground-primary-1">$EXIT HOLD</span>
<vw-symbol class="themed-node-217" name="vehicle-exit-prompt"></vw-symbol>
</div>

</body></html>
