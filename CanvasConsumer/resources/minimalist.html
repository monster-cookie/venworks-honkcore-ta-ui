<!doctype html><html><head><title>VWHUD</title></head><body>
<vw-hud-target target="canvas.watch" disabled="true"></vw-hud-target>
<vw-hud-target target="player.meters" disabled="true"></vw-hud-target>
<vw-include src="minimalist-radar.html"></vw-include>
<vw-include src="minimalist-quest-tracker.html"></vw-include>
<vw-include src="minimalist-planet-data-panel.html"></vw-include>
<vw-include src="minimalist-player-data-panel.html"></vw-include>
<vw-include src="minimalist-compass.html"></vw-include>
<vw-include src="minimalist-threat-meter.html"></vw-include>
<vw-include src="minimalist-status-effect-screen.html"></vw-include>
<vw-include src="minimalist-scanner-hash-panel.html"></vw-include>
<vw-include src="minimalist-scanner-data-panel.html"></vw-include>
<div class="minimalist-node-147 vwhud-alert-critical-health" data-vw-anchor="top-center" data-vw-visible="condition.criticalhealth"><svg class="minimalist-node-148 fill-panel-background-1" viewBox="0 0 100 100" stroke-width="0" fill-opacity="0.44" stroke-opacity="0"><rect x="0" y="0" width="100" height="100"></rect></svg>
<svg class="minimalist-node-149 paint-fill-70cfe0 paint-stroke-d9e3e8" viewBox="0 0 320 70" stroke-width="0" fill-opacity="0.10" stroke-opacity="0"><rect x="0" y="0" width="320" height="70"></rect></svg>
<svg class="minimalist-node-150 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 46 1" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 46 0"></path></svg>
<svg class="minimalist-node-151 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 1 15" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 0 15"></path></svg>
<svg class="minimalist-node-152 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 46 1" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 46 0"></path></svg>
<svg class="minimalist-node-153 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 1 15" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 0 15"></path></svg>
<svg class="minimalist-node-154 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 46 1" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 46 0"></path></svg>
<svg class="minimalist-node-155 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 1 15" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 0 15"></path></svg>
<svg class="minimalist-node-156 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 46 1" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 46 0"></path></svg>
<svg class="minimalist-node-157 paint-fill-none paint-stroke-ff3c54" viewBox="0 0 1 15" stroke-width="2" fill-opacity="0" stroke-opacity="1"><path d="M 0 0 L 0 15"></path></svg>
<span class="minimalist-node-158 paint-color-ff3c54">CRITICAL HEALTH</span>
<span class="minimalist-node-159 paint-color-ffffff" data-vw-template="HEALTH {player.health:integer}/{player.maxhealth:integer}"></span>
</div>
<div class="minimalist-node-160 vwhud-prompt-vehicle-exit" data-vw-anchor="bottom-center" data-vw-visible="condition.invehicle"><svg class="minimalist-node-161 fill-panel-background-1" viewBox="0 0 100 100" stroke-width="0" fill-opacity="0.44" stroke-opacity="0"><rect x="0" y="0" width="100" height="100"></rect></svg>
<svg class="minimalist-node-162 paint-fill-70cfe0 paint-stroke-d9e3e8" viewBox="0 0 184 36" stroke-width="0" fill-opacity="0.10" stroke-opacity="0"><rect x="0" y="0" width="184" height="36"></rect></svg>
<span class="minimalist-node-163 paint-color-ffffff">$EXIT HOLD</span>
<vw-symbol class="minimalist-node-164" name="vehicle-exit-prompt"></vw-symbol>
</div>

</body></html>
