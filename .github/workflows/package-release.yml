name: Package Venworks Customizable HUD Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

###############################################################################
# CONFIG: Update these for this creation.
#
# Keep UPLOAD_TO_NEXUSMODS set to false until the new Nexus group/file IDs are configured. When false, Nexus
# configuration validation and uploads are skipped even if legacy file IDs and the API key remain configured.
# Re-enable Nexus uploads by configuring the new IDs and changing UPLOAD_TO_NEXUSMODS to true.
# Each UPLOAD_<KEY>_TO_NEXUSMODS switch independently controls one variant. Keep the Minimalist switch false until
# that experimental build is ready for Nexus publication.
#
# Store the API key as a repository Actions secret. Store file IDs as repository Actions variables because they are not sensitive.
#
#   - NEXUSMODS_API_KEY the API key to use see https://www.nexusmods.com/settings/api-keys use the developer API key at the bottom of the page
#   - NEXUSMODS_FILE_ID_<KEY>_NORMAL and NEXUSMODS_FILE_ID_<KEY>_LOOSE the FILE IDs to replace in the Mod's Files section for each theme:
#       To get a file ID to use in this action, you need to have created a mod page on Nexus Mods and uploaded at least one file. The file ID
#       can be found by checking the "API Info" option in the Files tab of the public-facing mod page, or in the edit menu of the Manage Files page.
#       Configure file IDs as repository Actions variables. A missing file ID skips only that package's Nexus upload so its first package can
#       be uploaded manually. Existing repository secrets with the same names remain supported as fallbacks.
#
###############################################################################
env:
  UPLOAD_TO_NEXUSMODS: false
  UPLOAD_FC_TO_NEXUSMODS: false
  UPLOAD_CF_TO_NEXUSMODS: false
  UPLOAD_TA_TO_NEXUSMODS: false
  UPLOAD_VWKS_TO_NEXUSMODS: false
  UPLOAD_MIN_TO_NEXUSMODS: false
  NEXUSMODS_CATEGORY: main
  NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}

  NEXUSMODS_FILE_ID_FC_NORMAL: ${{ vars.NEXUSMODS_FILE_ID_FC_NORMAL || secrets.NEXUSMODS_FILE_ID_FC_NORMAL }}
  NEXUSMODS_FILE_ID_FC_LOOSE: ${{ vars.NEXUSMODS_FILE_ID_FC_LOOSE || secrets.NEXUSMODS_FILE_ID_FC_LOOSE }}
  NEXUSMODS_FILE_ID_CF_NORMAL: ${{ vars.NEXUSMODS_FILE_ID_CF_NORMAL || secrets.NEXUSMODS_FILE_ID_CF_NORMAL }}
  NEXUSMODS_FILE_ID_CF_LOOSE: ${{ vars.NEXUSMODS_FILE_ID_CF_LOOSE || secrets.NEXUSMODS_FILE_ID_CF_LOOSE }}
  NEXUSMODS_FILE_ID_TA_NORMAL: ${{ vars.NEXUSMODS_FILE_ID_TA_NORMAL || secrets.NEXUSMODS_FILE_ID_TA_NORMAL }}
  NEXUSMODS_FILE_ID_TA_LOOSE: ${{ vars.NEXUSMODS_FILE_ID_TA_LOOSE || secrets.NEXUSMODS_FILE_ID_TA_LOOSE }}
  NEXUSMODS_FILE_ID_VWKS_NORMAL: ${{ vars.NEXUSMODS_FILE_ID_VWKS_NORMAL || secrets.NEXUSMODS_FILE_ID_VWKS_NORMAL }}
  NEXUSMODS_FILE_ID_VWKS_LOOSE: ${{ vars.NEXUSMODS_FILE_ID_VWKS_LOOSE || secrets.NEXUSMODS_FILE_ID_VWKS_LOOSE }}
  NEXUSMODS_FILE_ID_MIN_NORMAL: ${{ vars.NEXUSMODS_FILE_ID_MIN_NORMAL || secrets.NEXUSMODS_FILE_ID_MIN_NORMAL }}
  NEXUSMODS_FILE_ID_MIN_LOOSE: ${{ vars.NEXUSMODS_FILE_ID_MIN_LOOSE || secrets.NEXUSMODS_FILE_ID_MIN_LOOSE }}


jobs:
  validate-tag-source:
    name: Validate Tag Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Verify tag and master HEAD
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_CREATED: ${{ github.event.created }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if [ "$TAG_CREATED" != "true" ]; then
            echo "Release tag '$TAG_NAME' was updated instead of newly created."
            exit 1
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG_NAME' must use the vX.Y.Z format."
            exit 1
          fi

          MASTER_SHA="$(gh api "repos/${{ github.repository }}/commits/master" --jq '.sha')"
          if [ "$TAG_SHA" != "$MASTER_SHA" ]; then
            echo "Tag is not on the current master HEAD."
            echo "Tag SHA: $TAG_SHA"
            echo "Master SHA: $MASTER_SHA"
            exit 1
          fi

          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

  package-release:
    name: Package Release
    needs: validate-tag-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_VERSION: ${{ needs.validate-tag-source.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Prepare release packages
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          & "$env:GITHUB_WORKSPACE/Tools/createReleasePackages.ps1" `
            -OutputDirectory $releaseRoot

          $releaseFiles = @(Get-ChildItem -LiteralPath $releaseRoot -File -Filter '*.zip')
          if ($releaseFiles.Count -ne 25) {
            throw "Expected 25 release ZIPs; found $($releaseFiles.Count)."
          }

          "release_root=$releaseRoot" >> $env:GITHUB_OUTPUT

      - name: Upload release package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: venworks-customizable-hud-release-${{ env.PACKAGE_VERSION }}
          path: artifacts/release/*.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub and Nexus Releases
    needs:
      - validate-tag-source
      - package-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.validate-tag-source.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release variant configuration
        id: variant-config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          . "$env:GITHUB_WORKSPACE/Tools/sharedConfig.ps1" -SkipEnvironment
          foreach ($variant in $Global:ReleaseVariants) {
            $key = $variant.VariantKey.ToLowerInvariant()
            "$($key)_nexus_normal_display_name=$($variant.NexusNormalDisplayName)" >> $env:GITHUB_OUTPUT
            "$($key)_nexus_loose_display_name=$($variant.NexusLooseDisplayName)" >> $env:GITHUB_OUTPUT
          }

      - name: Download release package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: venworks-customizable-hud-release-${{ env.PACKAGE_VERSION }}
          path: ./artifacts/release

      - name: Extract release notes
        id: release-notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:PACKAGE_VERSION
          $changeLogPath = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release/release-notes.md'
          $nexusDescriptionPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release/nexus-description.bbcode'
          $releaseNotes = "Release $version"

          if ([System.IO.File]::Exists($changeLogPath)) {
            $content = Get-Content -LiteralPath $changeLogPath -Raw
            $escapedVersion = [Regex]::Escape($version)
            $pattern = "(?ms)^## Version $escapedVersion\s*.*?(?=^## Version \d+\.\d+\.\d+|\z)"
            $match = [Regex]::Match($content, $pattern)

            if ($match.Success) {
              $releaseNotes = $match.Value.Trim()
            }
            else {
              Write-Warning "Unable to find release notes in CHANGELOG.md for version $version. Using fallback release notes."
            }
          }
          else {
            Write-Warning "CHANGELOG.md was not found. Using fallback release notes."
          }

          [System.IO.File]::WriteAllText($releaseNotesPath, $releaseNotes)

          $lines = $releaseNotes -split "\r?\n"
          $bbcodeLines = [System.Collections.Generic.List[string]]::new()
          $inList = $false

          foreach ($line in $lines) {
            if ($line -match '^\s*-\s+(.*)$') {
              if (-not $inList) {
                $bbcodeLines.Add('[list]')
                $inList = $true
              }

              $bbcodeLines.Add("[*]$($Matches[1])")
              continue
            }

            if ($inList) {
              $bbcodeLines.Add('[/list]')
              $inList = $false
            }

            if ($line -match '^##\s+(.+)$') {
              $bbcodeLines.Add("[b]$($Matches[1])[/b]")
              continue
            }

            if ($line -match '^###\s+(.+)$') {
              $bbcodeLines.Add("[b]$($Matches[1])[/b]")
              continue
            }

            $convertedLine = $line -replace '\*\*(.+?)\*\*', '[b]$1[/b]'
            $convertedLine = $convertedLine -replace '\*(.+?)\*', '[i]$1[/i]'
            $convertedLine = $convertedLine -replace '`(.+?)`', '$1'
            $bbcodeLines.Add($convertedLine)
          }

          if ($inList) {
            $bbcodeLines.Add('[/list]')
          }

          $nexusDescription = ($bbcodeLines -join [Environment]::NewLine).Trim()
          [System.IO.File]::WriteAllText($nexusDescriptionPath, $nexusDescription)

          "release_notes_path=$releaseNotesPath" >> $env:GITHUB_OUTPUT
          "nexus_description_path=$nexusDescriptionPath" >> $env:GITHUB_OUTPUT

          $delimiter = [Guid]::NewGuid().ToString()
          "nexus_description<<$delimiter" >> $env:GITHUB_OUTPUT
          $nexusDescription >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Resolve release packages
        id: release-package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          . "$env:GITHUB_WORKSPACE/Tools/sharedConfig.ps1" -SkipEnvironment
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $packageSuffixes = @(
            'Nexus PC - Normal',
            'Nexus PC - Fully Loose Files',
            'Bethesda PC',
            'Bethesda Xbox',
            'Bethesda PS5'
          )
          $expectedPackageNames = [System.Collections.Generic.List[string]]::new()

          foreach ($variant in $Global:ReleaseVariants) {
            $key = $variant.VariantKey.ToLowerInvariant()
            foreach ($packageSuffix in $packageSuffixes) {
              $packageName = "$($variant.ReleaseDisplayName) - $packageSuffix.zip"
              $expectedPackageNames.Add($packageName)
              $packagePath = Join-Path $releaseRoot $packageName
              if (-not [System.IO.File]::Exists($packagePath)) {
                throw "Unable to find release package '$packageName' for version $env:PACKAGE_VERSION."
              }
              if ((Get-Item -LiteralPath $packagePath).Length -le 0) {
                throw "Release package '$packageName' is empty."
              }
            }

            $normalPath = Join-Path $releaseRoot "$($variant.ReleaseDisplayName) - Nexus PC - Normal.zip"
            $loosePath = Join-Path $releaseRoot "$($variant.ReleaseDisplayName) - Nexus PC - Fully Loose Files.zip"
            "$($key)_normal_path=$normalPath" >> $env:GITHUB_OUTPUT
            "$($key)_loose_path=$loosePath" >> $env:GITHUB_OUTPUT
          }

          $actualPackageNames = @(
            Get-ChildItem -LiteralPath $releaseRoot -File -Filter '*.zip' |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          $expectedPackageNames = @($expectedPackageNames | Sort-Object)
          if ($actualPackageNames.Count -ne $expectedPackageNames.Count) {
            throw "Expected $($expectedPackageNames.Count) release packages; found $($actualPackageNames.Count)."
          }
          for ($index = 0; $index -lt $expectedPackageNames.Count; $index++) {
            if ($actualPackageNames[$index] -cne $expectedPackageNames[$index]) {
              throw "Downloaded release package set contains unexpected files."
            }
          }

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release-notes.outputs.release_notes_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/release/*.zip

      - name: Validate Nexus Mods upload configuration
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true }}
        shell: bash
        env:
          NEXUS_DISPLAY_NAME_FC_NORMAL: ${{ steps.variant-config.outputs.fc_nexus_normal_display_name }}
          NEXUS_DISPLAY_NAME_FC_LOOSE: ${{ steps.variant-config.outputs.fc_nexus_loose_display_name }}
          NEXUS_DISPLAY_NAME_CF_NORMAL: ${{ steps.variant-config.outputs.cf_nexus_normal_display_name }}
          NEXUS_DISPLAY_NAME_CF_LOOSE: ${{ steps.variant-config.outputs.cf_nexus_loose_display_name }}
          NEXUS_DISPLAY_NAME_TA_NORMAL: ${{ steps.variant-config.outputs.ta_nexus_normal_display_name }}
          NEXUS_DISPLAY_NAME_TA_LOOSE: ${{ steps.variant-config.outputs.ta_nexus_loose_display_name }}
          NEXUS_DISPLAY_NAME_VWKS_NORMAL: ${{ steps.variant-config.outputs.vwks_nexus_normal_display_name }}
          NEXUS_DISPLAY_NAME_VWKS_LOOSE: ${{ steps.variant-config.outputs.vwks_nexus_loose_display_name }}
          NEXUS_DISPLAY_NAME_MIN_NORMAL: ${{ steps.variant-config.outputs.min_nexus_normal_display_name }}
          NEXUS_DISPLAY_NAME_MIN_LOOSE: ${{ steps.variant-config.outputs.min_nexus_loose_display_name }}
        run: |
          configured_uploads=0

          check_upload() {
            local display_name="$2"
            local display_name_length=${#display_name}

            if [ -z "$display_name" ]; then
              echo "::error::Nexus Mods display name for $3 is empty."
              exit 1
            fi
            if [ "$display_name_length" -gt 50 ]; then
              echo "::error::Nexus Mods display name for $3 is $display_name_length characters; the maximum is 50: $display_name"
              exit 1
            fi

            if [ -n "$1" ]; then
              echo "Ready to upload $display_name."
              configured_uploads=$((configured_uploads + 1))
            else
              echo "::notice::Skipping $display_name because $3 is not configured."
            fi
          }

          check_variant_uploads() {
            case "$1" in
              true)
                check_upload "$3" "$4" "$5"
                check_upload "$6" "$7" "$8"
                ;;
              false)
                echo "::notice::Skipping $2 Nexus Mods uploads because its variant upload switch is false."
                ;;
              *)
                echo "::error::Nexus Mods upload switch for $2 must be true or false; found '$1'."
                exit 1
                ;;
            esac
          }

          check_variant_uploads "$UPLOAD_FC_TO_NEXUSMODS" "Freestar Collective" "$NEXUSMODS_FILE_ID_FC_NORMAL" "$NEXUS_DISPLAY_NAME_FC_NORMAL" "NEXUSMODS_FILE_ID_FC_NORMAL" "$NEXUSMODS_FILE_ID_FC_LOOSE" "$NEXUS_DISPLAY_NAME_FC_LOOSE" "NEXUSMODS_FILE_ID_FC_LOOSE"
          check_variant_uploads "$UPLOAD_CF_TO_NEXUSMODS" "Crimson Fleet" "$NEXUSMODS_FILE_ID_CF_NORMAL" "$NEXUS_DISPLAY_NAME_CF_NORMAL" "NEXUSMODS_FILE_ID_CF_NORMAL" "$NEXUSMODS_FILE_ID_CF_LOOSE" "$NEXUS_DISPLAY_NAME_CF_LOOSE" "NEXUSMODS_FILE_ID_CF_LOOSE"
          check_variant_uploads "$UPLOAD_TA_TO_NEXUSMODS" "Trackers Alliance" "$NEXUSMODS_FILE_ID_TA_NORMAL" "$NEXUS_DISPLAY_NAME_TA_NORMAL" "NEXUSMODS_FILE_ID_TA_NORMAL" "$NEXUSMODS_FILE_ID_TA_LOOSE" "$NEXUS_DISPLAY_NAME_TA_LOOSE" "NEXUSMODS_FILE_ID_TA_LOOSE"
          check_variant_uploads "$UPLOAD_VWKS_TO_NEXUSMODS" "Venworks" "$NEXUSMODS_FILE_ID_VWKS_NORMAL" "$NEXUS_DISPLAY_NAME_VWKS_NORMAL" "NEXUSMODS_FILE_ID_VWKS_NORMAL" "$NEXUSMODS_FILE_ID_VWKS_LOOSE" "$NEXUS_DISPLAY_NAME_VWKS_LOOSE" "NEXUSMODS_FILE_ID_VWKS_LOOSE"
          check_variant_uploads "$UPLOAD_MIN_TO_NEXUSMODS" "Minimalist" "$NEXUSMODS_FILE_ID_MIN_NORMAL" "$NEXUS_DISPLAY_NAME_MIN_NORMAL" "NEXUSMODS_FILE_ID_MIN_NORMAL" "$NEXUSMODS_FILE_ID_MIN_LOOSE" "$NEXUS_DISPLAY_NAME_MIN_LOOSE" "NEXUSMODS_FILE_ID_MIN_LOOSE"

          if [ "$configured_uploads" -gt 0 ] && [ -z "$NEXUSMODS_API_KEY" ]; then
            echo "NEXUSMODS_API_KEY is required for Nexus Mods uploads."
            exit 1
          fi

          echo "$configured_uploads Nexus Mods upload(s) configured."

      - name: Upload Freestar Collective normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_FC_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_FC_NORMAL != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_FC_NORMAL }}
          filename: ${{ steps.release-package.outputs.fc_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.fc_nexus_normal_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Freestar Collective fully loose release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_FC_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_FC_LOOSE != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_FC_LOOSE }}
          filename: ${{ steps.release-package.outputs.fc_loose_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.fc_nexus_loose_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Crimson Fleet normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_CF_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_CF_NORMAL != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_CF_NORMAL }}
          filename: ${{ steps.release-package.outputs.cf_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.cf_nexus_normal_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Crimson Fleet fully loose release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_CF_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_CF_LOOSE != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_CF_LOOSE }}
          filename: ${{ steps.release-package.outputs.cf_loose_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.cf_nexus_loose_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Trackers Alliance normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_TA_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_TA_NORMAL != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_TA_NORMAL }}
          filename: ${{ steps.release-package.outputs.ta_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.ta_nexus_normal_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Trackers Alliance fully loose release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_TA_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_TA_LOOSE != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_TA_LOOSE }}
          filename: ${{ steps.release-package.outputs.ta_loose_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.ta_nexus_loose_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Venworks normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_VWKS_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_VWKS_NORMAL != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_VWKS_NORMAL }}
          filename: ${{ steps.release-package.outputs.vwks_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.vwks_nexus_normal_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Venworks fully loose release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_VWKS_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_VWKS_LOOSE != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_VWKS_LOOSE }}
          filename: ${{ steps.release-package.outputs.vwks_loose_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.vwks_nexus_loose_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Minimalist normal release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_MIN_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_MIN_NORMAL != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_MIN_NORMAL }}
          filename: ${{ steps.release-package.outputs.min_normal_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.min_nexus_normal_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}

      - name: Upload Minimalist fully loose release to Nexus Mods
        if: ${{ fromJSON(env.UPLOAD_TO_NEXUSMODS) == true && fromJSON(env.UPLOAD_MIN_TO_NEXUSMODS) == true && env.NEXUSMODS_FILE_ID_MIN_LOOSE != '' }}
        uses: Nexus-Mods/upload-action@f6e1e2ea683dfe8f88cccf642c6e0e69ab66825e # v1.0.0-beta.8
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUSMODS_FILE_ID_MIN_LOOSE }}
          filename: ${{ steps.release-package.outputs.min_loose_path }}
          version: ${{ env.PACKAGE_VERSION }}
          category: ${{ env.NEXUSMODS_CATEGORY }}
          display_name: ${{ steps.variant-config.outputs.min_nexus_loose_display_name }}
          archive_existing_version: true
          primary_mod_manager_download: false
          allow_mod_manager_download: true
          description: ${{ steps.release-notes.outputs.nexus_description }}
