name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-powershell:
    name: Lint PowerShell
    runs-on: ubuntu-latest
    env:
      PSSCRIPTANALYZER_VERSION: "1.25.0"
      PSSCRIPTANALYZER_PATH: ./Tools
      PSSCRIPTANALYZER_SETTINGS: ./PSScriptAnalyzerSettings.psd1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Repository PSGallery -Scope CurrentUser -Force

      - name: Analyze PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $findings = @(
            Invoke-ScriptAnalyzer `
              -Path $env:PSSCRIPTANALYZER_PATH `
              -Recurse `
              -Settings $env:PSSCRIPTANALYZER_SETTINGS
          )
          foreach ($finding in $findings) {
            Write-Output ('{0} [{1}] {2}:{3} {4}' -f
              $finding.RuleName,
              $finding.Severity,
              $finding.ScriptPath,
              $finding.Line,
              $finding.Message)
          }
          if ($findings.Count -ne 0) {
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

  verify-committed-release:
    name: Verify Committed Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Verify PowerShell and committed release payload
        shell: pwsh
        run: ./Tools/verifyCommittedRelease.ps1

      - name: Verify Minimalist movie profile contract
        shell: pwsh
        run: ./Tools/verifyVariant.ps1 -VariantKeys MIN -Committed

      - name: Verify committed entry point without local environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $outputLines = @(& pwsh -NoProfile -File ./Tools/checkRepo.ps1 -Committed 2>&1)
          $exitCode = $LASTEXITCODE
          $outputLines | ForEach-Object { Write-Host $_ }
          $outputText = $outputLines -join "`n"

          if ($exitCode -ne 0) {
            throw "Committed repository check exited with code $exitCode."
          }
          if ($outputText -notmatch 'Selected Variant Build Artifacts Are Valid') {
            throw 'Committed repository check exited before reporting successful artifact validation.'
          }

  package-release:
    name: Package Release Smoke Test
    needs: verify-committed-release
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch release package LFS inputs
        shell: bash
        run: |
          git lfs pull --include="Staging-*/*.ba2,Staging-*/*.esm" --exclude=""

          for file in Staging-*/*.ba2 Staging-*/*.esm; do
            if grep -Fqx "version https://git-lfs.github.com/spec/v1" "$file"; then
              echo "::error file=$file::Release input remains a Git LFS pointer."
              exit 1
            fi
          done

      - name: Create and verify release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci-release'
          & "$env:GITHUB_WORKSPACE/Tools/createReleasePackages.ps1" `
            -OutputDirectory $releaseRoot

          $releaseFiles = @(Get-ChildItem -LiteralPath $releaseRoot -File -Filter '*.zip')
          if ($releaseFiles.Count -ne 25) {
            throw "Expected 25 release ZIPs; found $($releaseFiles.Count)."
          }
          if (@($releaseFiles | Where-Object { $_.Length -le 0 }).Count -ne 0) {
            throw 'One or more release ZIPs are empty.'
          }

          $minimalistBase = 'Venworks-CustomizableHUD-Minimalist'
          $minimalistStagingPath = Join-Path $env:GITHUB_WORKSPACE 'Staging-MIN'
          $minimalistLooseEntries = @(
            Get-ChildItem -LiteralPath (Join-Path $minimalistStagingPath 'Interface') -Recurse -File |
              ForEach-Object { $_.FullName.Substring($minimalistStagingPath.Length + 1).Replace('\', '/') } |
              Sort-Object
          )
          $expectedEntriesBySuffix = [ordered]@{
            'Nexus PC - Normal' = @(
              "$minimalistBase - Main.ba2"
              "$minimalistBase.esm"
            )
            'Nexus PC - Fully Loose Files' = $minimalistLooseEntries
            'Bethesda PC' = @("$minimalistBase - Main.ba2", "$minimalistBase.esm")
            'Bethesda Xbox' = @("$minimalistBase - Main_XBox.ba2", "$minimalistBase.esm")
            'Bethesda PS5' = @("$minimalistBase - Main_PS.ba2", "$minimalistBase.esm")
          }
          foreach ($packageSuffix in $expectedEntriesBySuffix.Keys) {
            $minimalistZipPath = Join-Path $releaseRoot "Venworks - Customizable HUD - Minimalist - $packageSuffix.zip"
            if (!(Test-Path -LiteralPath $minimalistZipPath -PathType Leaf)) {
              throw "The Minimalist $packageSuffix release ZIP was not created."
            }
            $minimalistZip = [System.IO.Compression.ZipFile]::OpenRead($minimalistZipPath)
            try {
              $minimalistEntries = @($minimalistZip.Entries.FullName | Sort-Object)
            }
            finally {
              $minimalistZip.Dispose()
            }
            $expectedMinimalistEntries = @($expectedEntriesBySuffix[$packageSuffix] | Sort-Object)
            if ($minimalistEntries.Count -ne $expectedMinimalistEntries.Count) {
              throw "Minimalist $packageSuffix ZIP contains $($minimalistEntries.Count) entries; expected $($expectedMinimalistEntries.Count)."
            }
            for ($index = 0; $index -lt $expectedMinimalistEntries.Count; $index++) {
              if ($minimalistEntries[$index] -cne $expectedMinimalistEntries[$index]) {
                throw "Minimalist $packageSuffix ZIP contains unexpected entries."
              }
            }
          }

          Write-Host "Verified all 25 release ZIPs, including all five exact Minimalist packages."
