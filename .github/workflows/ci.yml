name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-powershell:
    name: Lint PowerShell
    runs-on: ubuntu-latest
    env:
      PSSCRIPTANALYZER_VERSION: "1.25.0"
      PSSCRIPTANALYZER_PATH: ./Tools
      PSSCRIPTANALYZER_SETTINGS: ./PSScriptAnalyzerSettings.psd1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Repository PSGallery -Scope CurrentUser -Force

      - name: Analyze PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $findings = @(
            Invoke-ScriptAnalyzer `
              -Path $env:PSSCRIPTANALYZER_PATH `
              -Recurse `
              -Settings $env:PSSCRIPTANALYZER_SETTINGS
          )
          foreach ($finding in $findings) {
            Write-Output ('{0} [{1}] {2}:{3} {4}' -f
              $finding.RuleName,
              $finding.Severity,
              $finding.ScriptPath,
              $finding.Line,
              $finding.Message)
          }
          if ($findings.Count -ne 0) {
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

  verify-committed-release:
    name: Verify Committed Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Verify PowerShell and committed release payload
        shell: pwsh
        run: ./Tools/verifyCommittedRelease.ps1

      - name: Verify all variant movie and archive contracts
        shell: pwsh
        run: ./Tools/verifyVariant.ps1 -Committed

      - name: Verify committed entry point without local environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $outputLines = @(& pwsh -NoProfile -File ./Tools/checkRepo.ps1 -Committed 2>&1)
          $exitCode = $LASTEXITCODE
          $outputLines | ForEach-Object { Write-Host $_ }
          $outputText = $outputLines -join "`n"

          if ($exitCode -ne 0) {
            throw "Committed repository check exited with code $exitCode."
          }
          if ($outputText -notmatch 'Selected Variant Build Artifacts Are Valid') {
            throw 'Committed repository check exited before reporting successful artifact validation.'
          }

  package-release:
    name: Package Release Smoke Test
    needs: verify-committed-release
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch release package LFS inputs
        shell: bash
        run: |
          git lfs pull --include="Staging-*/*.ba2,Staging-*/*.esm" --exclude=""

          for file in Staging-*/*.ba2 Staging-*/*.esm; do
            if grep -Fqx "version https://git-lfs.github.com/spec/v1" "$file"; then
              echo "::error file=$file::Release input remains a Git LFS pointer."
              exit 1
            fi
          done

      - name: Create and verify release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci-release'
          & "$env:GITHUB_WORKSPACE/Tools/createReleasePackages.ps1" `
            -OutputDirectory $releaseRoot

          $releaseFiles = @(Get-ChildItem -LiteralPath $releaseRoot -File -Filter '*.zip')
          if ($releaseFiles.Count -ne 25) {
            throw "Expected 25 release ZIPs; found $($releaseFiles.Count)."
          }
          if (@($releaseFiles | Where-Object { $_.Length -le 0 }).Count -ne 0) {
            throw 'One or more release ZIPs are empty.'
          }

          . "$env:GITHUB_WORKSPACE/Tools/sharedConfig.ps1" -SkipEnvironment
          $expectedMovieNames = @(
            'hudmenu.gfx'
            'hudmenu.swf'
            'hudmenu_lrg.gfx'
            'hudmenu_lrg.swf'
            'hudmessagesmenu.gfx'
            'hudmessagesmenu.swf'
            'hudmessagesmenu_lrg.gfx'
            'hudmessagesmenu_lrg.swf'
            'venworkscui.swf'
          ) | Sort-Object
          $expectedZipNames = @(
            foreach ($variant in $Global:ReleaseVariants) {
              foreach ($packageSuffix in @(
                'Nexus PC - Normal'
                'Nexus PC - Fully Loose Files'
                'Bethesda PC'
                'Bethesda Xbox'
                'Bethesda PS5'
              )) {
                "$($variant.ReleaseDisplayName) - $packageSuffix.zip"
              }
            }
          ) | Sort-Object
          if ([string]::Join("`n", @($releaseFiles.Name | Sort-Object)) -cne
              [string]::Join("`n", $expectedZipNames)) {
            throw 'Release ZIP names do not match the exact five-variant package matrix.'
          }

          foreach ($variant in $Global:ReleaseVariants) {
            $stagingPath = Join-Path $env:GITHUB_WORKSPACE $variant.StagingFolderPath
            $interfacePath = Join-Path $stagingPath 'Interface'
            $actualMovieNames = @(
              Get-ChildItem -LiteralPath $interfacePath -Recurse -File |
                Where-Object { $_.Extension -in @('.gfx', '.swf') } |
                ForEach-Object { [System.IO.Path]::GetRelativePath($interfacePath, $_.FullName).Replace('\', '/') } |
                Sort-Object
            )
            if ([string]::Join("`n", $actualMovieNames) -cne
                [string]::Join("`n", $expectedMovieNames)) {
              throw "$($variant.VariantName) staging does not contain the exact nine-movie Interface inventory."
            }

            foreach ($hostBaseName in @('hudmenu', 'hudmenu_lrg')) {
              $gfxPath = Join-Path $interfacePath "$hostBaseName.gfx"
              $swfPath = Join-Path $interfacePath "$hostBaseName.swf"
              if ((Get-FileHash -LiteralPath $gfxPath -Algorithm SHA256).Hash -cne
                  (Get-FileHash -LiteralPath $swfPath -Algorithm SHA256).Hash) {
                throw "$($variant.VariantName) $hostBaseName.gfx is not byte-identical to $hostBaseName.swf."
              }
              foreach ($hostPath in @($gfxPath, $swfPath)) {
                $signature = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($hostPath), 0, 3)
                if ($signature -cne 'CWS') {
                  throw "$($variant.VariantName) $([System.IO.Path]::GetFileName($hostPath)) must contain CWS bytes."
                }
              }
            }
            foreach ($messageMovie in @(
              [pscustomobject]@{ FileName = 'hudmessagesmenu.gfx'; Signature = 'GFX' }
              [pscustomobject]@{ FileName = 'hudmessagesmenu.swf'; Signature = 'CWS' }
              [pscustomobject]@{ FileName = 'hudmessagesmenu_lrg.gfx'; Signature = 'GFX' }
              [pscustomobject]@{ FileName = 'hudmessagesmenu_lrg.swf'; Signature = 'CWS' }
            )) {
              $messagePath = Join-Path $interfacePath $messageMovie.FileName
              $signature = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($messagePath), 0, 3)
              if ($signature -cne $messageMovie.Signature) {
                throw "$($variant.VariantName) $($messageMovie.FileName) must contain $($messageMovie.Signature) bytes."
              }
            }

            $baseName = $variant.PackageBaseName
            $looseEntries = @(
              Get-ChildItem -LiteralPath $interfacePath -Recurse -File |
                ForEach-Object { [System.IO.Path]::GetRelativePath($stagingPath, $_.FullName).Replace('\', '/') } |
                Sort-Object
            )
            $windowsArchives = @("$baseName - Main.ba2")
            if (Test-Path -LiteralPath (Join-Path $stagingPath "$baseName - Textures.ba2") -PathType Leaf) {
              $windowsArchives += "$baseName - Textures.ba2"
            }
            $xboxArchives = @("$baseName - Main_XBox.ba2")
            if (Test-Path -LiteralPath (Join-Path $stagingPath "$baseName - Textures_XBox.ba2") -PathType Leaf) {
              $xboxArchives += "$baseName - Textures_XBox.ba2"
            }
            $psArchives = @("$baseName - Main_PS.ba2")
            if (Test-Path -LiteralPath (Join-Path $stagingPath "$baseName - Textures_PS.ba2") -PathType Leaf) {
              $psArchives += "$baseName - Textures_PS.ba2"
            }
            $expectedEntriesBySuffix = [ordered]@{
              'Nexus PC - Normal' = @("$baseName.esm") + $windowsArchives + @('Interface/VenworksCUI/layout.xml')
              'Nexus PC - Fully Loose Files' = $looseEntries
              'Bethesda PC' = @("$baseName.esm") + $windowsArchives
              'Bethesda Xbox' = @("$baseName.esm") + $xboxArchives
              'Bethesda PS5' = @("$baseName.esm") + $psArchives
            }
            foreach ($packageSuffix in $expectedEntriesBySuffix.Keys) {
              $zipPath = Join-Path $releaseRoot "$($variant.ReleaseDisplayName) - $packageSuffix.zip"
              $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
              try {
                $entries = @($zip.Entries.FullName | Sort-Object)
              }
              finally {
                $zip.Dispose()
              }
              $expectedEntries = @($expectedEntriesBySuffix[$packageSuffix] | Sort-Object)
              if ($entries.Count -ne $expectedEntries.Count -or
                  [string]::Join("`n", $entries) -cne [string]::Join("`n", $expectedEntries)) {
                throw "$($variant.VariantName) $packageSuffix ZIP contains unexpected entries."
              }
            }
          }

          Write-Host 'Verified all 25 release ZIP shapes and all five nine-movie staging contracts.'
