name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-powershell:
    name: Lint PowerShell
    runs-on: ubuntu-latest
    env:
      PSSCRIPTANALYZER_VERSION: "1.25.0"
      PSSCRIPTANALYZER_PATH: ./Tools
      PSSCRIPTANALYZER_SETTINGS: ./PSScriptAnalyzerSettings.psd1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($null -eq (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Repository PSGallery -Scope CurrentUser -Force

      - name: Analyze PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $findings = @(Invoke-ScriptAnalyzer -Path $env:PSSCRIPTANALYZER_PATH -Recurse -Settings $env:PSSCRIPTANALYZER_SETTINGS)
          foreach ($finding in $findings) {
            Write-Output ('{0} [{1}] {2}:{3} {4}' -f $finding.RuleName, $finding.Severity, $finding.ScriptPath, $finding.Line, $finding.Message)
          }
          if ($findings.Count -ne 0) {
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

  verify-committed-release:
    name: Verify Committed Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Verify committed Canvas consumer release
        shell: pwsh
        run: ./Tools/verifyCommittedRelease.ps1

      - name: Verify all five consumer movie and archive contracts
        shell: pwsh
        run: ./Tools/verifyVariant.ps1 -Committed

      - name: Reject undeclared staging files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./Tools/sharedConfig.ps1 -SkipEnvironment
          $variant = @(Get-ModuleVariants -VariantKeys TA)[0]
          $unexpectedPath = Join-Path $variant.StagingFolderPath "codex-ci-$([guid]::NewGuid().ToString('N')).esm"
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            [IO.File]::WriteAllText($unexpectedPath, 'unexpected staging payload')
            $output = @(& pwsh -NoProfile -File ./Tools/verifyVariant.ps1 -VariantKeys TA -Committed 2>&1)
            if ($LASTEXITCODE -eq 0 -or ($output -join "`n") -notmatch 'missing or competing files') {
              $output | ForEach-Object { Write-Host $_ }
              throw 'Consumer verification did not reject an undeclared staging file.'
            }
          }
          finally {
            Remove-Item -LiteralPath $unexpectedPath -Force -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE = 0

      - name: Verify committed entry point bypasses local environment
        shell: pwsh
        run: ./Tools/checkRepo.ps1 -Committed

      - name: Verify committed packaging reaches the explicit Archive2 check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TOOL_PATH_ARCHIVER = $null
          $output = @(& pwsh -NoProfile -File ./Tools/createPackages.ps1 -VariantKeys TA -Committed 2>&1)
          if ($LASTEXITCODE -eq 0 -or ($output -join "`n") -notmatch 'TOOL_PATH_ARCHIVER must name') {
            $output | ForEach-Object { Write-Host $_ }
            throw 'Committed packaging did not reach the explicit Archive2 environment check.'
          }
          if (($output -join "`n") -match '\.env file') {
            throw 'Committed packaging attempted to load local environment configuration.'
          }
          $global:LASTEXITCODE = 0

  package-release:
    name: Package Release Smoke Test
    needs: verify-committed-release
    runs-on: ubuntu-latest
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch release package LFS inputs
        shell: bash
        run: |
          git lfs pull --include="Staging-*/*.ba2,Staging-*/*.esm" --exclude=""
          for file in Staging-*/*.ba2 Staging-*/*.esm; do
            if grep -Fqx "version https://git-lfs.github.com/spec/v1" "$file"; then
              echo "::error file=$file::Release input remains a Git LFS pointer."
              exit 1
            fi
          done

      - name: Create and verify release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci-release'
          & "$env:GITHUB_WORKSPACE/Tools/createReleasePackages.ps1" -OutputDirectory $releaseRoot
          $releaseFiles = @(Get-ChildItem -LiteralPath $releaseRoot -File -Filter '*.zip')
          if ($releaseFiles.Count -ne 25) {
            throw "Expected 25 release ZIPs; found $($releaseFiles.Count)."
          }
          if (@($releaseFiles | Where-Object { $_.Length -le 0 }).Count -ne 0) {
            throw 'One or more release ZIPs are empty.'
          }

          . "$env:GITHUB_WORKSPACE/Tools/sharedConfig.ps1" -SkipEnvironment
          $expectedNames = @(
            foreach ($variant in $Global:ReleaseVariants) {
              foreach ($suffix in @(Get-VariantReleasePackageSuffixes -Variant $variant)) {
                "$($variant.ReleaseDisplayName) - $suffix.zip"
              }
            }
          ) | Sort-Object
          if ([string]::Join("`n", @($releaseFiles.Name | Sort-Object)) -cne [string]::Join("`n", $expectedNames)) {
            throw 'Release ZIP names do not match the five-theme package matrix.'
          }
          Write-Host 'Verified all 25 configured Canvas consumer release ZIP shapes.'
